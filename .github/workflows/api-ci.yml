name: API CI
#on: [push]
on:
  push:
      paths:
        - "./api/**"
        - ".github/workflows/api-ci.yml"

defaults:
  run:
      working-directory: ./api

jobs:
    unit-test:
      runs-on: ubunto-lastest
      steps:
        - name: Checkout
          uses: actions/Checkout@v2
        - name: setup
          uses: actions/setup-node@v2
          whith:
                node-version 24.21.0
                cache: 'npm'
                cache-dependency-path: ./api/package-lock.json
        - name: install
          shell: bash
          run: npm ci
        - name: run unit test
          shell: bach
          run: npm run test

jobs:
    unit-test:
      runs-on: ubunto-lastest
      steps:
        - name: Checkout
          uses: actions/Checkout@v2
        - name: setup
          uses: actions/setup-node@v2
          whith:
                node-version 24.21.0
                cache: 'npm'
                cache-dependency-path: ./api/package-lock.json
        - name: install
          shell: bash
          run: npm ci
        - name: run unit test
          shell: bach
          run: npm run lint

e2e:
  runs-on: ubunto-lastest
  container:
    image: node:24.21.0:
  services:
    mongo-e2e:
      image: mongo:4.4
      ports:
        - 27017:27017
      env:
        MONGO_INITDB_ROOT_USERNAME: test
        MONGO_INITDB_ROOT_PASSWORD: test123
  steps:
   - name: Checkout
     uses: actions/Checkout@v2
   - name: install
     shell: bash
     run: npm ci
   - name: run e2e
     shell: bach
     run: npm run test:e2e
     env:
      MONGO_DB_NAME=demo
      MONGO_URL=mongodb://test:test123@mongo-e2e:27017?retryWrites=true&writeConcern=majority



